        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="12"
        fill="#7d8590">→ Backend · Automation · Python · C# · SQL</text>

  <text x="1140" y="170"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="12"
        fill="#7d8590"
        text-anchor="end">status: open to opportunities</text>

  <!-- Tiny status dot -->
  <circle cx="1126" cy="166" r="4" fill="#3fb950"/>
</svg>