<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200">
  <!-- Solid neutral dark background -->
  <rect width="1200" height="200" fill="#0d1117"/>

  <!-- Subtle accent line (left) -->
  <rect x="0" y="0" width="6" height="200" fill="#58a6ff"/>

  <!-- Subtle grid pattern (very low opacity) -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="6" y="0" width="1194" height="200" fill="url(#grid)" opacity="0.4"/>

  <!-- Name -->
  <text x="60" y="100"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="52"
        font-weight="700"
        fill="#f0f6fc">ElRed_26</text>

  <!-- Role -->
  <text x="60" y="135"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="18"
        font-weight="400"
        fill="#8b949e">Backend Developer · Python &amp; C# · Santo Domingo, DO</text>

  <!-- Right-side meta info -->
  <text x="1140" y="60"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="13"
        font-weight="500"
        fill="#8b949e"
        text-anchor="end">$ whoami</text>
  <text x="1140" y="82"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="14"
        font-weight="600"
