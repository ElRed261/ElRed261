<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- Modern monogram: ER initials with terminal prompt style -->
  <rect width="320" height="320" fill="#0d1117"/>

  <!-- Subtle grid -->
  <defs>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="320" height="320" fill="url(#grid2)" opacity="0.5"/>

  <!-- Terminal prompt symbol -->
  <text x="160" y="180"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="140"
        font-weight="600"
        fill="#58a6ff"
        text-anchor="middle">&gt;_</text>

  <!-- Name below -->
  <text x="160" y="230"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="24"
        font-weight="600"
        fill="#f0f6fc"
        text-anchor="middle">ElRed_26</text>

  <!-- Subtle accent line -->
  <line x1="100" y1="260" x2="220" y2="260" stroke="#58a6ff" stroke-width="2"/>
  <text x="160" y="280"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="11"
        fill="#7d8590"
        text-anchor="middle">backend · automation · AI</text>
</svg>